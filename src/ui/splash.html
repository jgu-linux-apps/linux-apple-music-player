<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Linux Apple Music Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:720px;height:420px;overflow:hidden;background:transparent;font-family:"Ubuntu Sans","Ubuntu","Cantarell",sans-serif;user-select:none;-webkit-app-region:drag}
.card{position:absolute;inset:0;border-radius:22px;overflow:hidden}
.light .card{background:radial-gradient(ellipse at 100% 0%,#ffe3e3 0%,transparent 55%),radial-gradient(ellipse at 0% 100%,#ffe9ec 0%,transparent 60%),linear-gradient(140deg,#ffffff,#fff5f5);color:#2b1622}
.dark .card{background:radial-gradient(ellipse at 100% 0%,rgba(229,36,43,.18) 0%,transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(200,16,46,.24) 0%,transparent 60%),linear-gradient(140deg,#151827,#0d0f1a);color:#fff3ec}
.vinyl{position:absolute;right:-150px;bottom:-170px;width:480px;height:480px;animation:spin 18s linear infinite}
.light .vinyl{opacity:.16}.dark .vinyl{opacity:.30}
@keyframes spin{to{transform:rotate(360deg)}}
.icon{position:absolute;left:52px;top:56px;width:120px;height:120px;filter:drop-shadow(0 14px 26px rgba(200,16,46,.28))}
.kick{position:absolute;left:52px;top:200px;font-size:14px;letter-spacing:4px;font-weight:700;text-transform:uppercase;color:#d71f2c}
.dark .kick{color:#ff5a5a}
h1{position:absolute;left:50px;top:222px;font-size:50px;line-height:1.02;font-weight:800;letter-spacing:-1px;width:620px}
h1 b{background:linear-gradient(90deg,#ff4b4b,#c8102e);-webkit-background-clip:text;color:transparent}
.credit{position:absolute;left:52px;bottom:42px;font-size:15px;opacity:.75}
.credit span{opacity:.5;margin:0 8px}
.bar{position:absolute;left:52px;bottom:26px;width:180px;height:3px;border-radius:2px;background:rgba(127,127,127,.22);overflow:hidden}
.bar i{position:absolute;top:0;left:-40%;width:40%;height:100%;border-radius:2px;background:linear-gradient(90deg,#ff4b4b,#c8102e);animation:load 1.2s ease-in-out infinite}
@keyframes load{to{left:100%}}
</style></head>
<body class="light"><div class="card">
<svg class="vinyl" viewBox="0 0 480 480"><defs><linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4b4b"/><stop offset="1" stop-color="#c8102e"/></linearGradient><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".25"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><circle cx="240" cy="240" r="236" fill="#0b0b0e"/><circle cx="240" cy="240" r="70" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="82" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="94" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="106" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="118" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="130" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="142" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="154" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="166" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="178" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="190" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="202" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="214" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="226" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/><circle cx="240" cy="240" r="236" fill="url(#sh)"/><circle cx="240" cy="240" r="62" fill="url(#lb)"/><circle cx="240" cy="240" r="9" fill="#0b0b0e"/></svg>
<img class="icon" id="icon" src="../assets/icon-light.svg" alt="">
<div class="kick">JGu Linux Apps</div>
<h1>Linux Apple<br><b>Music Player</b></h1>
<div class="credit">Created by: JGu<span>·</span>Supported by Claude</div>
<div class="bar"><i></i></div>
</div>
<script>
  // light / dark from the main process (?theme=dark), so it matches the system theme exactly
  var dark = new URLSearchParams(location.search).get('theme') === 'dark';
  document.body.className = dark ? 'dark' : 'light';
  document.getElementById('icon').src = '../assets/icon-' + (dark ? 'dark' : 'light') + '.svg';
</script>
</body></html>
